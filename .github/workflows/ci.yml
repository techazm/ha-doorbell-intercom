# Continuous integration. `ci-ok` is the single required status check: it passes only
# when every job above it succeeded, so jobs can be added without touching the ruleset.
# Pull requests only: main only changes through squash-merged PRs that already passed. CodeQL still runs
# on main (codeql.yml): code scanning needs a baseline there.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast repo-wide checks in one job: GitHub bills every job rounded up to a whole minute, so several
  # 10-second jobs cost a minute each and together they cost one. It runs alongside the slower jobs, so it
  # adds no wall-clock time. actionlint and gitleaks are checksum-verified release binaries (no sudo or
  # Docker), so this also runs on the self-hosted runner.
  checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write  # dependency-review comments on the PR when it fails
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans the full history
          persist-credentials: false
      - name: Install actionlint and gitleaks (checksum-verified)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          get() {  # <release url> <tarball> <checksums file> <binary>
            curl -sSfLO "$1/$2"
            curl -sSfLO "$1/$3"
            grep " $2\$" "$3" | sha256sum -c -
            tar -xzf "$2" "$4"
          }
          get "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}" \
            "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" actionlint
          get "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}" \
            "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Lints the shell in run: steps too when shellcheck is installed (GitHub-hosted and the local runner).
      - name: Lint workflow files (actionlint)
        run: actionlint -color
      - name: Secret scan across the full history (gitleaks)
        run: gitleaks git . --redact --no-banner --verbose --exit-code 1
      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: doorbell_intercom/Dockerfile
          failure-threshold: error
      # New or updated dependencies with a known high-severity advisory fail the PR.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  addon:
    name: Add-on lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Lint add-on config
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7  # v2.21.1
        with:
          path: ./doorbell_intercom

  node:
    name: Server install and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: doorbell_intercom/server/package-lock.json
      - name: Use the npm pinned in package.json
        run: npm install -g --no-audit --no-fund "$(node -p "require('./doorbell_intercom/server/package.json').packageManager")"
      - name: Install (locked)
        run: npm ci
        working-directory: doorbell_intercom/server
      - name: Syntax check
        run: |
          node --check doorbell_intercom/server/server.js
          node --check doorbell_intercom/ui/app.js
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: doorbell_intercom/server

  ci-ok:
    name: ci-ok
    if: always()
    needs: [checks, addon, node]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then exit 1; fi
          done
